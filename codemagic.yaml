workflows:
  ios-workflow:
    name: Longmidle iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.35.7
      xcode: latest

    scripts:
      - name: Use CocoaPods instead of Swift Package Manager
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS
        script: flutter build ipa --release --build-name=1.2.2 --build-number=32 --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa